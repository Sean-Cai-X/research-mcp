name: Build & Publish Release Binary

# 推送 v* 或 gn-* 标签触发构建；支持 workflow_dispatch 手动触发
on:
  push:
    tags:
      - 'v*'
      - 'gn-*'
  workflow_dispatch:

# 授权:允许创建 Release、上传制品
permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: 检出仓库完整源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 WebView2 NuGet 包并组织到 third_party/WebView2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          # NuGet 包本质是 zip,但 Expand-Archive 只认 .zip 扩展名,必须用 .zip 下载
          $nupkg = "WebView2.zip"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2792.45" `
            -OutFile $nupkg -MaximumRedirection 10
          $extract = "WebView2-nupkg"
          Expand-Archive -Path $nupkg -DestinationPath $extract -Force

          # 组织成 CMakeLists 期望的目录结构(NuGet 包内实际路径为 build/native/...):
          #   third_party/WebView2/include/WebView2.h
          #   third_party/WebView2/include/WebView2EnvironmentOptions.h
          #   third_party/WebView2/lib/x64/WebView2Loader.dll.lib
          #   third_party/WebView2/redist/x64/WebView2Loader.dll
          $dst = "third_party/WebView2"
          New-Item -ItemType Directory -Force -Path "$dst/include", "$dst/lib/x64", "$dst/redist/x64" | Out-Null
          Copy-Item "$extract/build/native/include/WebView2.h"                 "$dst/include/" -Force
          Copy-Item "$extract/build/native/include/WebView2EnvironmentOptions.h" "$dst/include/" -Force
          Copy-Item "$extract/build/native/x64/WebView2Loader.dll.lib"         "$dst/lib/x64/" -Force
          # redist dll: 优先 runtimes/win-x64/native,回退 build/native/x64
          $redistSrc = "$extract/runtimes/win-x64/native/WebView2Loader.dll"
          if (-not (Test-Path $redistSrc)) {
            $redistSrc = "$extract/build/native/x64/WebView2Loader.dll"
          }
          Copy-Item $redistSrc "$dst/redist/x64/" -Force
          Write-Host "WebView2 SDK 就位:"
          Get-ChildItem -Recurse $dst | Select-Object FullName

      - name: 下载 nlohmann/json 单头到 third_party/json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = "third_party/json/include/nlohmann"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Invoke-WebRequest -Uri "https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp" `
            -OutFile "$dst/json.hpp"
          Write-Host "nlohmann/json 就位: $dst/json.hpp ($((Get-Item "$dst/json.hpp").Length) bytes)"

      - name: 加载 MSVC 编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 下载 libcurl 官方预编译包并生成 libcurl.lib
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          # CMakeLists 期望 third_party/curl/curl-*-win64-mingw 目录,内含 include/curl/curl.h 与 bin/libcurl-x64.def
          $dst = "third_party/curl"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $zip = "$dst/curl-mingw.zip"
          Invoke-WebRequest -Uri "https://curl.se/windows/dl-8.20.0_4/curl-8.20.0_4-win64-mingw.zip" `
            -OutFile $zip -MaximumRedirection 10
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          Remove-Item $zip -Force
          $curlDir = Get-ChildItem -Path $dst -Directory -Filter "curl-*-win64-mingw" | Select-Object -First 1
          if (-not $curlDir) { throw "未找到 curl-*-win64-mingw 目录" }
          # 用 MSVC lib.exe 从 def 生成 libcurl.lib(CMakeLists 第 60 行校验 lib/libcurl.lib)
          lib /machine:x64 /def:"$($curlDir.FullName)/bin/libcurl-x64.def" /out:"$($curlDir.FullName)/lib/libcurl.lib"
          Write-Host "libcurl 就位: $($curlDir.FullName)"
          Get-ChildItem -Recurse $curlDir.FullName |
            Where-Object { $_.Name -match 'curl\.h$|libcurl\.lib$|libcurl-x64\.dll$' } |
            Select-Object FullName

      - name: CMake 配置 + 编译 Release(静态 CRT 已在 CMakeLists 固化为 /MT)
        shell: pwsh
        run: |
          mkdir build-release -Force
          cd build-release
          # CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded 作为全局默认双保险,
          # research-mcp / test_smoke 两个 target 已在 CMakeLists 内显式 set_property 为 MultiThreaded
          cmake -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" `
                ..
          cmake --build . --config Release

      - name: 打包程序(exe + WebView2Loader.dll + 配置示例)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          mkdir deploy -Force

          # exe: VS 多配置生成器输出在 Release/ 下
          $exeSrc = "build-release/Release/research-mcp.exe"
          if (-not (Test-Path $exeSrc)) {
            $exeSrc = "build-release/research-mcp.exe"
          }
          if (-not (Test-Path $exeSrc)) { throw "未找到 research-mcp.exe" }
          Copy-Item $exeSrc "deploy/"

          # WebView2Loader.dll 由 CMake POST_BUILD 复制到 exe 同目录,纯净机器运行必需
          $dllSrc = "build-release/Release/WebView2Loader.dll"
          if (-not (Test-Path $dllSrc)) {
            $dllSrc = "build-release/WebView2Loader.dll"
          }
          if (Test-Path $dllSrc) {
            Copy-Item $dllSrc "deploy/"
          } else {
            Write-Host "::warning::未找到 WebView2Loader.dll,纯净机器运行会失败"
          }

          # libcurl-x64.dll + CA 证书(POST_BUILD 已复制到 exe 同目录,libcurl HTTPS 运行时依赖)
          foreach ($rt in @("libcurl-x64.dll", "curl-ca-bundle.crt")) {
            $rtSrc = "build-release/Release/$rt"
            if (-not (Test-Path $rtSrc)) { $rtSrc = "build-release/$rt" }
            if (Test-Path $rtSrc) {
              Copy-Item $rtSrc "deploy/"
            } else {
              Write-Host "::warning::未找到 $rt,libcurl HTTPS 可能失败"
            }
          }

          # 附带配置示例(可选)
          if (Test-Path "mcp_config_example.json") { Copy-Item "mcp_config_example.json" "deploy/" }
          if (Test-Path ".env.example")            { Copy-Item ".env.example" "deploy/" }
          if (Test-Path "README.md")               { Copy-Item "README.md" "deploy/" }

          7z a research-mcp-windows-x64.zip deploy/*
          Write-Host "打包完成,zip 内容:"
          7z l research-mcp-windows-x64.zip

      - name: 自动创建 Release 并上传压缩包
        uses: softprops/action-gh-release@v2
        with:
          files: research-mcp-windows-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
