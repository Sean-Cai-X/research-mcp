name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
      - 'gn-*'
  workflow_dispatch:

permissions:
  contents: write

# ============================================================================
# 所有第三方库由 CMake FetchContent 从官方源码/发行包拉取:
#   nlohmann/json -> GitHub tag v3.11.3
#   curl          -> GitHub tag curl-8_20_0 (WebSocket API)
#   WebView2 SDK  -> NuGet Microsoft.Web.WebView2 (仅 WEBVIEW2 后端)
#   sqlite3       -> 仓库 third_party/sqlite/ (amalgamation 源码)
# ============================================================================

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            backend: WEBVIEW2
            artifact: research-mcp-windows-x64-webview2.zip
          - os: windows-latest
            backend: CDP
            artifact: research-mcp-windows-x64-cdp.zip
          - os: ubuntu-latest
            backend: CDP
            artifact: research-mcp-linux-x64-cdp.tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      # ── Linux: 系统依赖 (OpenSSL 供 curl, ca-certificates 供 HTTPS) ──────
      - name: 安装系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake libssl-dev ca-certificates pkg-config

      # ── Windows: 加载 MSVC 编译环境 ──────────────────────────────────────
      - name: 加载 MSVC 编译环境 (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ── CMake Configure + Build ──────────────────────────────────────────
      # FetchContent 在 configure 阶段自动从 GitHub/NuGet 拉取:
      #   Windows:   curl(static+Schannel) + nlohmann_json(static) + WebView2(NuGet zip)
      #   Linux CDP: curl(static+OpenSSL) + nlohmann_json(static)
      - name: CMake Configure + Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
                -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" `
                -DRESEARCH_MCP_BROWSER_BACKEND="${{ matrix.backend }}"
          cmake --build build --config Release -j 4

      - name: CMake Configure + Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                        -DRESEARCH_MCP_BROWSER_BACKEND="${{ matrix.backend }}"
          cmake --build build -j"$(nproc)"

      # ── 打包 ─────────────────────────────────────────────────────────────
      - name: 打包 Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "deploy" | Out-Null

          $exe = if (Test-Path "build/Release/research-mcp.exe") { "build/Release/research-mcp.exe" } else { "build/research-mcp.exe" }
          Copy-Item $exe "deploy/" -Force

          # FetchContent 生成的 curl 是静态链接到 exe 的, 运行时不需要 .dll
          # 只有 WebView2Loader.dll (NuGet 解压后) 需要带
          foreach ($rt in @("WebView2Loader.dll")) {
            foreach ($cand in @("build/Release/$rt", "build/$rt")) {
              if (Test-Path $cand) { Copy-Item $cand "deploy/" -Force; break }
            }
          }

          $zip = "${{ matrix.artifact }}"
          7z a $zip deploy/*

      - name: 打包 Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p deploy
          find build -name research-mcp -type f -executable -exec cp {} deploy/ \;
          tar czf "${{ matrix.artifact }}" deploy/

      # ── 上传 artifact ────────────────────────────────────────────────────
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # ── Release 创建 ──────────────────────────────────────────────────
  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release 并上传制品
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: false
          draft: false
          prerelease: false
          body: |
            ## 🚀 v0.3.5: FetchContent 纯源码构建 + CDP 跨平台后端

            ### 零预编译二进制

            所有依赖由 CMake FetchContent 从官方源码/发行包拉取, 仓库只存源码:
            | 依赖 | 来源 |
            |------|------|
            | nlohmann/json | GitHub tag v3.11.3 |
            | curl 8.20 | GitHub tag curl-8_20_0 (WebSocket API) |
            | WebView2 SDK | NuGet Microsoft.Web.WebView2 (仅 WEBVIEW2) |
            | sqlite3 | third_party/sqlite/ (amalgamation) |

            curl 静态链接到 exe, 无运行时 DLL 依赖.

            ### 后端对比

            | 维度 | Windows WebView2 | Windows CDP | Linux CDP |
            |------|------------------|-------------|-----------|
            | 需要 Edge Runtime | ✅ | ❌ | ❌ |
            | 需要 Chrome | ❌ | ✅ | ✅ |
            | 体积 | 大 | 小 | 小 |
            | 进程模型 | 嵌入 | 独立 Chrome | 独立 Chrome |

            ### 快速启动

            ```bash
            # Windows CDP
            ./research-mcp.exe --port 8771 --arxiv-profile ./profiles/arxiv

            # Linux CDP (需 CHROME_PATH 或系统 Chrome)
            CHROME_PATH=/usr/bin/google-chrome-stable ./research-mcp --port 8771 --arxiv-profile ./profiles/arxiv
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
