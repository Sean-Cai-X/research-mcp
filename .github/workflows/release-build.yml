name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
      - 'gn-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            backend: WEBVIEW2
            artifact: research-mcp-windows-x64-webview2.zip
          - os: windows-latest
            backend: CDP
            artifact: research-mcp-windows-x64-cdp.zip
          - os: ubuntu-latest
            backend: CDP
            artifact: research-mcp-linux-x64-cdp.tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Linux: apt install (唯一外网下载,走 apt 官方仓库) ────────────────
      - name: 安装系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev ca-certificates nlohmann-json3-dev pkg-config

      # ── Windows: 加载 MSVC 编译环境 ──────────────────────────────────────
      - name: 加载 MSVC 编译环境 (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ── 编译 ───────────────────────────────────────────────────────────────
      - name: CMake 配置 + 编译 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null
          Set-Location build
          cmake -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" `
                -DRESEARCH_MCP_BROWSER_BACKEND="${{ matrix.backend }}" `
                ..
          cmake --build . --config Release

      - name: CMake 配置 + 编译 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                        -DRESEARCH_MCP_BROWSER_BACKEND="${{ matrix.backend }}"
          cmake --build build -j"$(nproc)"

      # ── 打包 ───────────────────────────────────────────────────────────────
      - name: 打包 Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "deploy" | Out-Null
          $exe = if (Test-Path "build/Release/research-mcp.exe") { "build/Release/research-mcp.exe" } else { "build/research-mcp.exe" }
          Copy-Item $exe "deploy/" -Force

          foreach ($rt in @("WebView2Loader.dll", "libcurl-x64.dll", "curl-ca-bundle.crt")) {
            foreach ($cand in @("build/Release/$rt", "build/$rt")) {
              if (Test-Path $cand) { Copy-Item $cand "deploy/" -Force; break }
            }
          }

          $zip = "${{ matrix.artifact }}"
          7z a $zip deploy/*

      - name: 打包 Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p deploy
          find build -name research-mcp -type f -executable -exec cp {} deploy/ \;
          tar czf "${{ matrix.artifact }}" deploy/

      # ── 上传 artifact ───────────────────────────────────────────────────────
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # ── Release ──────────────────────────────────────────────────────────
  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release 并上传制品
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: false
          draft: false
          prerelease: false
          body: |
            ## 🚀 v0.3.5: CI 修复 + CDP 跨平台后端

            ### 后端对比

            | 维度 | Windows WebView2 | Windows CDP | Linux CDP |
            |------|------------------|-------------|-----------|
            | 需要 Edge Runtime | ✅ | ❌ | ❌ |
            | 需要 Chrome | ❌ | ✅ | ✅ |
            | 体积 | 大 | 小 | 小 |
            | 进程模型 | 嵌入 | 独立 Chrome | 独立 Chrome |

            ### 快速启动

            ```bash
            # Windows CDP
            ./research-mcp.exe --port 8771 --arxiv-profile ./profiles/arxiv

            # Linux CDP (需 CHROME_PATH 或系统 Chrome)
            CHROME_PATH=/usr/bin/google-chrome-stable ./research-mcp --port 8771 --arxiv-profile ./profiles/arxiv
            ```

            ### 下载说明

            - **Windows WebView2**: 推荐有 Edge Runtime 的 Windows 10/11 用户
            - **Windows CDP / Linux CDP**: 下载对应平台 CDP 版（需系统已安装 Chrome）
            - **源码包**: GitHub Release 自动附带 Source code (zip) / (tar.gz)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
