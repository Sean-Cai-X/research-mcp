name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
      - 'gn-*'
  workflow_dispatch:

permissions:
  contents: write

# ============================================================================
# 依赖来源:
#   nlohmann/json -> FetchContent, GitHub tag v3.11.3
#   curl 8.20     -> third_party/curl-8.20.0/ (仓库已内置, 静态 Schannel/OpenSSL)
#   sqlite3       -> third_party/sqlite/ (amalgamation 源码, 已内置)
#
# 浏览器后端: 固定 CDP (已物理删除 WebView2 代码), 无需 CMake 开关
# ============================================================================

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: research-mcp-windows-x64.zip
          - os: ubuntu-latest
            artifact: research-mcp-linux-x64.tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      # ── Linux: 系统依赖 (OpenSSL 供 curl, ca-certificates 供 HTTPS) ──────
      - name: 安装系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake libssl-dev ca-certificates pkg-config

      # ── Windows: 加载 MSVC 编译环境 ──────────────────────────────────────
      - name: 加载 MSVC 编译环境 (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ── CMake Configure + Build ──────────────────────────────────────────
      # 浏览器后端已硬编码 CDP, 不再有 RESEARCH_MCP_BROWSER_BACKEND 开关
      - name: CMake Configure + Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
                -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded"
          cmake --build build --config Release -j 4

      - name: CMake Configure + Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      # ── 打包 ─────────────────────────────────────────────────────────────
      - name: 打包 Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "deploy" | Out-Null

          $exe = if (Test-Path "build/Release/research-mcp.exe") { "build/Release/research-mcp.exe" } else { "build/research-mcp.exe" }
          Copy-Item $exe "deploy/" -Force

          # curl 静态链接到 exe, SQLite 也静态链接, 无运行时 .dll 依赖
          $zip = "${{ matrix.artifact }}"
          7z a $zip deploy/*

      - name: 打包 Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p deploy
          find build -name research-mcp -type f -executable -exec cp {} deploy/ \;
          tar czf "${{ matrix.artifact }}" deploy/

      # ── 上传 artifact ────────────────────────────────────────────────────
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # ── Release 创建 ──────────────────────────────────────────────────
  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release 并上传制品
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: false
          draft: false
          prerelease: false
          body: |
            ## 🚀 v0.4.0: 四层态势感知 + 事件研判 + CDP 固定后端

            ### Breaking Changes

            - WebView2 已物理删除, 固定 CDP 后端
            - CMake 不再有后端开关, 直接 cmake -B build 即可

            ### 新特性

            #### 四层态势感知 (Situation Engine)
            完整嵌入 focus_sprawl_tick 每轮执行周期:
            - **Layer 1 基准快照**: 蔓延前后各做一次全量快照
            - **Layer 2 差分计算**: 逐维度对比, 标注来源锚点
            - **Layer 3 态势解析**: 增量生长报告 + 主干道 Top3 三维加权
            - **Layer 4 事件研判**: 通用四维度 + 分级通知

            #### 研判层 (Judgement Layer)
            通用四维度自动解读: 领域定位 / 事件性质 / 影响半径 / 趋势信号,
            分级输出: flash/important 四维度完整研判 + 参考判断 / normal 标准研判 + 节点卡片

            #### 三层分级通知 (11 类)
            - flash (4): 跨领域通路 / 枢纽节点接入 / 生长方向突变 / 竞争格局
            - important (3): 持续停滞 / 大规模修剪 / 核心节点变动
            - normal (4): 路径耗尽 / 生长停滞 / 节点修剪 / 关系解除

            #### 其他
            - focus_tick_history SQLite 表 (21 tables total) + 每轮自动落库
            - --auto-sprawl [SECONDS] CLI flag + 后台自动蔓延线程
            - 代理统一传递: --proxy 写入进程环境变量, 所有 curl + CDP Chrome 统一继承
            - CDP WebSocket 自动重连 (2 retry policy)
            - 引用溯源 _source: 每个工具返回自动注入 source 元数据
            - S2 429 指数退避 + 300ms 跨请求节流
            - arXiv OR fallback 首次 all:match 空自动拆词重试

            ### 后端

            | 平台 | 浏览器后端 | 依赖 |
            |------|-----------|------|
            | Windows x64 | CDP (固定) | Chrome headless (需系统安装) |
            | Linux x64   | CDP (固定) | Chrome/Chromium headless |

            ### 依赖来源 (仓库零预编译二进制)

            | 依赖 | 来源 |
            |------|------|
            | nlohmann/json | FetchContent, GitHub tag v3.11.3 |
            | curl 8.20 | third_party/curl-8.20.0/ 静态源码 |
            | sqlite3 | third_party/sqlite/ amalgamation |

            curl + SQLite 均静态链接到 exe, 运行时零 .dll 依赖.

            ### 快速启动

            ```bash
            # Windows (零浏览器依赖, 60+ 核心工具启动即用)
            ./research-mcp.exe --port 8765 --proxy http://127.0.0.1:7897

            # 启用自动蔓延后台线程 (默认 300s 每 tick)
            ./research-mcp.exe --port 8765 --auto-sprawl --proxy http://127.0.0.1:7897

            # Linux
            ./research-mcp --port 8765
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
